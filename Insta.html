<style>
  #ig-embed-section {
    --base:     #0D0221;
    --base-2:   #170A34;
    --line:     rgba(255,255,255,0.08);
    --ink:      #F5F3FA;
    --ink-dim:  #9A93B8;
    --blue:     #3897F0;

    background: var(--base);
    padding: 40px 4vw 60px;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
  }

  .ige-card {
    width: 100%;
    max-width: 1040px;
    background: var(--base);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  /* ---------- header ---------- */
  .ige-header {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 28px 32px;
    flex-wrap: wrap;
  }

  .ige-avatar {
    width: 76px; height: 76px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 220deg, #ffdb8b, #ee2a7b, #8134af, #4776e6, #ffdb8b);
    flex-shrink: 0;
  }
  .ige-avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 3px solid var(--base);
  }

  .ige-id {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-right: auto;
  }
  .ige-name {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .ige-name svg { width: 17px; height: 17px; flex-shrink: 0; }
  .ige-handle { font-size: 14px; color: var(--ink-dim); font-weight: 500; }

  .ige-stats {
    display: flex;
    gap: 34px;
  }
  .ige-stat { text-align: center; }
  .ige-stat-num {
    font-size: 19px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.1;
  }
  .ige-stat-label {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .ige-follow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    text-decoration: none;
    padding: 11px 22px;
    border-radius: 10px;
    transition: filter 0.2s ease, transform 0.2s ease;
  }
  .ige-follow:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .ige-follow svg { width: 17px; height: 17px; }

  /* ---------- grid ---------- */
  .ige-grid-wrap { position: relative; }

  .ige-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }

  .ige-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    display: block;
    background: var(--base-2);
  }
  .ige-cell img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), filter 0.3s ease;
  }
  .ige-cell:hover img { transform: scale(1.05); filter: brightness(0.75); }

  .ige-cell-icon {
    position: absolute;
    top: 10px; right: 10px;
    width: 19px; height: 19px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.7));
  }

  /* carousel nav arrows */
  .ige-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(13,2,33,0.6);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    z-index: 2;
  }
  .ige-nav svg { width: 16px; height: 16px; }
  .ige-nav.prev { left: 12px; }
  .ige-nav.next { right: 12px; }

  @media (max-width: 640px) {
    .ige-header { padding: 22px 20px; gap: 16px; }
    .ige-avatar { width: 60px; height: 60px; }
    .ige-name { font-size: 16px; }
    .ige-stats { gap: 18px; }
    .ige-stat-num { font-size: 15px; }
    .ige-stat-label { font-size: 11px; }
    .ige-follow { padding: 9px 16px; font-size: 13px; }
    .ige-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ige-cell img, .ige-follow { transition: none; }
  }
</style>
